name: Market data update
on:
  schedule:
    - cron: '45 23 * * 1-5'
  workflow_dispatch:
    inputs:
      check_deployment:
        description: Publish this run ID to verify that an Actions commit reaches Pages
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-market-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate session or skip a closed market
        id: refresh
        continue-on-error: true
        run: python scripts/update_market.py
      - name: Validate release and commit changes
        env:
          REFRESH_RESULT: ${{ steps.refresh.outcome }}
          CHECK_DEPLOYMENT: ${{ inputs.check_deployment }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          if [ "$REFRESH_RESULT" = success ]; then
            python scripts/update_market.py --verify
            git add -- public/data/latest.json public/data/sessions.json public/data/history public/data/status.json
            if [ "$CHECK_DEPLOYMENT" = true ]; then
              test -n "$PAGES_URL" || { echo "Set PAGES_URL before testing a deployment."; exit 1; }
              echo "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > public/data/deployment-check.txt
              git add -- public/data/deployment-check.txt
            fi
          else
            git add -- public/data/status.json
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Refresh market dashboard session status and data"
            git push
          fi
      - name: Verify production or trigger a Pages build
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python -m scripts.verify_deployment
      - name: Flag failed update
        if: steps.refresh.outcome == 'failure'
        run: exit 1
